<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="AquApp — your daily hydration companion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6BB8F7"/>
      <stop offset="1" stop-color="#2B87E8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- vagues -->
  <path d="M0 250 C 200 205, 380 300, 600 255 S 1000 205, 1200 250 L1200 340 L0 340 Z" fill="url(#wave)"/>
  <path d="M0 285 C 220 250, 420 330, 640 290 S 1020 250, 1200 290 L1200 340 L0 340 Z" fill="#FFFFFF" fill-opacity="0.10"/>

  <!-- bulles -->
  <circle cx="1040" cy="80" r="10" fill="#FFFFFF" fill-opacity="0.25"/>
  <circle cx="1085" cy="125" r="6" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="990" cy="140" r="4" fill="#FFFFFF" fill-opacity="0.2"/>

  <!-- goutte -->
  <g transform="translate(150 70)">
    <rect x="-70" y="-10" width="160" height="160" rx="38" fill="#FFFFFF" fill-opacity="0.16"/>
    <path d="M10 15 C 10 15, -35 70, -35 100 A 45 45 0 0 0 55 100 C 55 70, 10 15, 10 15 Z"
          fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"/>
  </g>

  <text x="300" y="150" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-1">AquApp</text>
  <text x="302" y="200" fill="#FFFFFF" fill-opacity="0.92" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="500">Your daily hydration companion for iPhone</text>
  <text x="302" y="240" fill="#FFFFFF" fill-opacity="0.75" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500">Water · Alcohol · Streaks · Achievements · No account · No tracking</text>
</svg>
