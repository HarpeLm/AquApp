name: iOS CI

on:
  push:
    branches: [ main, fixbug/appdatastore, security/keychain ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'docs:')

    env:
      SCHEME: "AquApp"
      PROJECT: "AquApp.xcodeproj"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose environment (Xcodes + simulateurs)
        run: |
          ls /Applications | grep -i xcode
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone | head -8

      - name: Select default Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('**/*.swift', '**/*.xcodeproj') }}
          restore-keys: |
            ${{ runner.os }}-derived-

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [^()]*' | head -1 | sed 's/[[:space:]]*$//')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "generic/platform=iOS Simulator" \
            -quiet

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:AquAppTests \
            -resultBundlePath TestResults.xcresult

      # Parcours réels dans l'app (base en mémoire). La visite des écrans
      # (ScreenshotTourTests) ne tourne que sur demande : elle n'est pas lancée ici.
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -project "$PROJECT" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:AquAppTestsUi/AquAppUITests \
            -resultBundlePath UITestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            UITestResults.xcresult
          retention-days: 14
          if-no-files-found: warn
